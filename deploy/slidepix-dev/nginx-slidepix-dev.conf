# Include the map once, inside http { }.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Include the locations inside the server { } that already terminates TLS.
# proxy_pass has no URI path, so /slidepix-dev is forwarded unchanged.
location = /slidepix-dev {
    return 301 /slidepix-dev/;
}

location /slidepix-dev/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
